name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # tests don't need ffmpeg-static's postinstall download
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: smoke test the published entry point
        shell: bash
        run: |
          node bin/yoinks.js --version
          node bin/yoinks.js --help > /dev/null

  node-guard:
    # bin/yoinks.js must refuse old Node with a clear message
    # instead of crashing inside ink's dependency tree
    name: refuses node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: expect a clean refusal
        run: |
          set +e
          output=$(node bin/yoinks.js --help 2>&1)
          code=$?
          set -e
          echo "$output"
          test "$code" -eq 1
          echo "$output" | grep -q "requires Node.js 22 or later"
